name: Deploy Frontend to VPS

on:
  push:
    branches:
      - production

jobs:
  build-and-deploy:
    name: Build & Deploy NexCampus-FE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: pnpm build

      - name: Sync build artifacts to VPS via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude='node_modules' --exclude='.git' --exclude='.env.local'
          path: ./
          remote_path: /var/www/nexcampus/NexCampus-FE
          remote_host: ${{ secrets.VPS_HOST }}
          remote_port: ${{ secrets.VPS_PORT }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Reload Frontend PM2 Process
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            # Load NVM (SSH action dùng non-interactive shell, không tự load ~/.bashrc)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd /var/www/nexcampus/NexCampus-FE

            echo "Cài đặt production dependencies..."
            pnpm install --prod --frozen-lockfile

            echo "Reload Frontend trên PM2..."
            pm2 describe nexcampus-fe > /dev/null 2>&1 && pm2 reload nexcampus-fe || pm2 start node_modules/next/dist/bin/next --name "nexcampus-fe" -- start --port 3000
            pm2 save

            echo "Frontend deploy thành công!"
