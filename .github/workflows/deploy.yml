name: Deploy Frontend to VPS

on:
  push:
    branches:
      - production

jobs:
  build-and-deploy:
    name: Build & Deploy NexCampus-FE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js (standalone output)
        run: npm run build

      - name: Sync build artifacts to VPS via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          # Sync code + .next (standalone) + public, bỏ node_modules
          switches: -avzr --delete --exclude='node_modules' --exclude='.git' --exclude='.env.local'
          path: ./
          remote_path: /var/www/nexcampus/NexCampus-FE
          remote_host: ${{ secrets.VPS_HOST }}
          remote_port: ${{ secrets.VPS_PORT }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Rebuild & Restart Frontend container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /var/www/nexcampus/NexCampus-BE

            echo "Build và restart Frontend container..."
            docker-compose up -d --build frontend --no-deps

            echo "Frontend deploy thành công!"
            docker-compose ps frontend
