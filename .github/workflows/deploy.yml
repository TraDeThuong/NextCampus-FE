name: Deploy Frontend to VPS (GHCR)

on:
  push:
    branches:
      - production

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push FE Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js (standalone output)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.nexcampus.io.vn/api/v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/tradethuong/nexcampus-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /var/www/nexcampus/NexCampus-BE

            echo "Authenticating Docker with GHCR..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u tradethuong --password-stdin

            echo "Pulling frontend image from GHCR..."
            docker-compose pull -q frontend

            echo "Stopping and removing old container..."
            docker-compose stop frontend || true
            docker-compose rm -f frontend || true

            echo "Re-creating frontend container..."
            docker-compose up -d --no-deps frontend

            echo "Pruning unused images..."
            docker image prune -f

            echo "Frontend deployed successfully!"
            docker-compose ps frontend
